<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bottari">
<title>Bottari</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poor+Story&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M13 21h8"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<!-- 시작 화면: JS보다 먼저 그려지게 HTML에 둠. 움직임은 app.js splash() (목업 .grill/bottari-splash-mockup.html A안) -->
<div id="splash" aria-hidden="true">
  <svg class="s-mark" viewBox="0 34 180 130">
    <g class="s-body"><path d="M 58 86 C 30 96, 24 140, 40 148 C 60 156, 120 156, 140 148 C 156 140, 150 96, 122 86 C 108 92, 72 92, 58 86 Z" fill="var(--mk)"/><path d="M 72 96 C 64 112, 62 128, 66 144 M 108 96 C 116 112, 118 128, 114 144" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/></g>
    <path class="s-earl" d="M 84 77 C 70 52, 50 42, 43 55 C 38 66, 62 79, 82 83 Z" fill="var(--km)"/>
    <path class="s-earr" d="M 96 77 C 110 52, 130 42, 137 55 C 142 66, 118 79, 98 83 Z" fill="var(--km)"/>
    <ellipse class="s-knot" cx="90" cy="81" rx="12" ry="9.5" fill="var(--km)"/>
  </svg>
  <div class="s-word pen-title"><span>B</span><span>o</span><span>t</span><span>t</span><span>a</span><span>r</span><span>i</span></div>
  <div class="s-tag">한국에서 챙겨 올 것, 둘이 같이 적는 곳</div>
</div>

<!-- ── 로그인 ── -->
<section id="screen-auth" hidden>
  <div class="auth-box">
    <h1 class="pen-title">Bottari</h1>
    <p class="auth-sub">한국에서 챙겨 올 것, 둘이 같이 적는 곳</p>
    <form id="login-form">
      <label>이메일<input type="email" id="login-email" autocomplete="username" required></label>
      <label>비밀번호<input type="password" id="login-pw" autocomplete="current-password" required></label>
      <button type="submit" class="btn-primary press" id="login-btn">로그인</button>
      <p id="login-err" class="err" hidden></p>
    </form>
    <p class="auth-note">Pairfolio와 같은 계정이에요.</p>
  </div>
</section>

<!-- ── 앱 ── -->
<div id="app" hidden>
  <main id="scr">
    <header class="hd">
      <h1 class="pen-title" id="title">살 것</h1>
      <span class="hd-r">
        <button id="trip-btn" class="trip press" aria-label="여행 탭으로"></button>
        <button id="search-btn" class="icon-btn press" aria-label="찾기"><svg class="i"><use href="#i-search"/></svg></button>
      </span>
    </header>
    <div class="search" id="search" hidden>
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="살 것·후보·선물·참고에서 찾기" aria-label="찾기" autocomplete="off">
      <button id="q-close" class="icon-btn press" aria-label="찾기 닫기"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="key"><span><i class="mk"></i>민경이 적음</span><span><i class="km"></i>규문이 적음</span></div>
    <p class="hint" id="hint" hidden><span id="hint-text"></span><button id="hint-x" class="icon-btn press" aria-label="안내 닫기"><svg class="i"><use href="#i-x"/></svg></button></p>
    <div id="list"></div>
  </main>

  <form id="add" class="inbar" autocomplete="off">
    <span class="pen-dot" id="pen-dot" title="지금 들고 있는 펜"></span>
    <input id="add-text" enterkeyhint="done" placeholder="한 줄 적기" aria-label="한 줄 적기">
    <button type="button" id="add-place" class="kind press"></button>
    <button type="submit" class="go press" aria-label="적기"><svg class="i"><use href="#i-pen"/></svg></button>
  </form>

  <nav class="tabs">
    <button class="press" data-tab="buy"><svg class="i"><use href="#i-bag"/></svg>살 것</button>
    <button class="press" data-tab="cand"><svg class="i"><use href="#i-bulb"/></svg>후보</button>
    <button class="press" data-tab="gift"><svg class="i"><use href="#i-gift"/></svg>선물</button>
    <button class="press" data-tab="ref"><svg class="i"><use href="#i-bookmark"/></svg>참고</button>
    <button class="press" data-tab="trip"><svg class="i"><use href="#i-plane"/></svg>여행</button>
  </nav>
</div>

<div id="sheet-back" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-act" hidden></button></div>

<script type="module" src="app.js"></script>
</body>
</html>
